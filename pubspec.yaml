name: mobile
description: "CryptoMarket Mobile App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0
  
  # State Management
  flutter_riverpod: ^2.5.0
  
  # Routing
  go_router: ^14.0.0
  
  # Storage & Auth
  flutter_secure_storage: ^9.2.0
  jwt_decoder: ^2.0.1
  
  # UI & Charts
  fl_chart: ^0.68.0
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
